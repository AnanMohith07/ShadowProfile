<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ShadowProfile</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="login-page">
        <div class="background-blur blur1"></div>
        <div class="background-blur blur2"></div>
        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">
                <div class="col-lg-5 col-md-8">
                    <div class="login-card">
                        <div class="text-center mb-4">
                            <div class="logo-circle">
                                <i class="bi bi-shield-lock-fill"></i>
                            </div>
                            <h2 class="mt-4">
                                Welcome Back
                            </h2>
                            <p>
                                Sign in to continue using ShadowProfile
                            </p>
                        </div>
                        <form id="loginForm">
                            <div class="mb-4">
                                <label class="form-label">
                                    Email Address
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-envelope-fill"></i>
                                    </span>
                                    <input type="email" class="form-control" id="email" placeholder="Enter Email"
                                        required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label class="form-label">
                                    Password
                                </label>
                                <div class="input-group">
                                    <span class="input-group-text">
                                        <i class="bi bi-lock-fill"></i>
                                    </span>
                                    <input type="password" class="form-control" id="password"
                                        placeholder="Enter Password" required>
                                    <button type="button" class="btn btn-outline-secondary" id="togglePassword">
                                        <i class="bi bi-eye"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="remember">
                                    <label class="form-check-label">
                                        Remember Me
                                    </label>
                                </div>
                                <a href="#">
                                    Forgot Password?
                                </a>
                            </div>
                            <button type="submit" class="btn btn-warning w-100 login-btn">
                                Login
                            </button>
                            <div class="text-center mt-4">
                                Don't have an account?
                                <a href="register.html">
                                    Create One
                                </a>
                            </div>
                        </form>
                        <div id="loginMessage" class="mt-3 text-center">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
